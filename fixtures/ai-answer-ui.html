<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Carbon AI answer fixture</title>
  </head>
  <body class="popup">
    <div id="source-question">
      <label for="motivation">Why are you interested in this role?</label>
      <textarea id="motivation" name="motivation"></textarea>
    </div>
    <div id="root"></div>
    <script type="module">
      const { detectFields } = await import('../src/content/detect.ts')
      const detect = detectFields()
      document.querySelector('#source-question').remove()

      const store = {
        version: 1,
        identity: {
          firstName: 'Taylor', middleName: '', lastName: 'Morgan', nameSuffix: '', preferredName: '',
          email: 'taylor@example.com', phone: '', phoneAlt: '', address1: '', address2: '', city: 'San Diego',
          state: 'CA', postalCode: '92101', country: 'United States', linkedin: '', github: '', portfolio: '',
          website: '', headline: 'Product designer', summary: 'Designs accessible products.', workAuthorized: 'yes',
          needsSponsorship: 'no', willingToRelocate: '', noticePeriod: '', salaryExpectation: '', pronouns: '',
          desiredJobTitle: 'Senior product designer', yearsExperience: '8', citizenship: '', visaStatus: '',
          employmentType: '', remotePreference: '', willingToTravel: '', gender: '', ethnicity: '', veteranStatus: '',
          disabilityStatus: '',
        },
        experience: [{
          id: 'exp_1', company: 'Northwind Labs', title: 'Product designer', location: 'San Diego, CA',
          startDate: '2020', endDate: '', current: true, description: 'Led accessible product design.',
        }],
        education: [],
        skills: ['Product design', 'Accessibility', 'User research'],
        answers: [],
        resume: null,
        settings: { openrouterKey: 'fixture-key', openrouterModel: 'openai/gpt-4.1-mini', fillUnmatchedWithAI: true },
      }

      const browserFetch = window.fetch.bind(window)
      window.fetch = async (input, init) => {
        if (String(input).startsWith('https://openrouter.ai/')) {
          document.body.dataset.aiRequest = init.body
          return new Response(JSON.stringify({
            choices: [{ message: { content: 'I am interested because my accessibility and user-research experience fits this product design role.' } }],
          }), { status: 200, headers: { 'Content-Type': 'application/json' } })
        }
        return browserFetch(input, init)
      }

      window.chrome = {
        storage: {
          local: { get: async () => ({ 'carbon.store.v1': store }), set: async () => {} },
          onChanged: { addListener: () => {}, removeListener: () => {} },
        },
        tabs: {
          query: async () => [{ id: 1, url: 'https://jobs.example.com/application', title: 'Senior product designer' }],
          sendMessage: async (_tabId, message) => {
            if (message.type === 'DETECT') return detect
            if (message.type === 'EXPAND_REPEATERS') return { experienceAdded: 0, educationAdded: 0 }
            if (message.type === 'FILL') {
              document.body.dataset.fillRequest = JSON.stringify(message.payload)
              return { filled: message.payload.items.length, filledUids: message.payload.items.map((item) => item.uid), failed: [] }
            }
            return null
          },
        },
      }

      const { h, render } = await import('preact')
      const { App } = await import('../src/ui/App.tsx')
      render(h(App, { mode: 'popup' }), document.querySelector('#root'))
    </script>
  </body>
</html>
