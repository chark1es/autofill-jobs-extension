<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TEKsystems Salesforce fixture</title>
    <style>
      body { font: 16px/1.4 system-ui; max-width: 700px; margin: 32px auto; }
      c-lwc-text-inputs, c-lwc-drop-down-menu, c-as-apply-question { display: block; margin: 16px 0; }
      .as-answer-item { display: inline-block; margin-right: 12px; }
      [role="menu"] { border: 1px solid #ccc; width: 240px; }
      [role="menuitem"] { padding: 7px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <c-lwc-file-upload>
      <label for="resume">File upload</label>
      <input id="resume" type="file" />
    </c-lwc-file-upload>

    <c-lwc-text-inputs><p class="labelText" id="first-label">First Name *</p><input aria-labelledby="first-label" placeholder="First Name" required /></c-lwc-text-inputs>
    <c-lwc-text-inputs><p class="labelText" id="last-label">Last Name *</p><input aria-labelledby="last-label" placeholder="Last Name" required /></c-lwc-text-inputs>
    <c-lwc-text-inputs><p class="labelText" id="phone-label">Phone Number *</p><input aria-labelledby="phone-label" placeholder="Phone Number" type="tel" maxlength="12" required /></c-lwc-text-inputs>
    <c-lwc-text-inputs><p class="labelText" id="email-label">Email *</p><input aria-labelledby="email-label" placeholder="Email Address" required /></c-lwc-text-inputs>
    <c-lwc-text-inputs><p class="labelText" id="address-label">Mailing Address</p><input aria-labelledby="address-label" placeholder="123 Main St." /></c-lwc-text-inputs>
    <c-lwc-text-inputs><p class="labelText" id="city-label">City</p><input aria-labelledby="city-label" placeholder="Beverly Hills" /></c-lwc-text-inputs>

    <c-lwc-drop-down-menu data-kind="country">
      <p class="labelTextDropDown">Country <span class="asterisk">*</span><lightning-button-menu aria-label="Select a Country"><button type="button" aria-haspopup="true" aria-expanded="false">Select a Country<span>Show menu</span></button></lightning-button-menu></p>
    </c-lwc-drop-down-menu>
    <c-lwc-drop-down-menu data-kind="state">
      <p class="labelTextDropDown">State <span class="asterisk">*</span><lightning-button-menu aria-label="Select a State"><button type="button" aria-haspopup="true" aria-expanded="false">Select a State<span>Show menu</span></button></lightning-button-menu></p>
    </c-lwc-drop-down-menu>
    <c-lwc-text-inputs><p class="labelText" id="zip-label">Zip Code *</p><input aria-labelledby="zip-label" placeholder="90210" required /></c-lwc-text-inputs>

    <c-as-apply-question id="authorization">
      <h1 class="as-question-title">Are you authorized to work in "U.S." ?<span>*</span></h1>
      <div class="as-answers-container">
        <div class="as-answer-item"><input type="radio" id="auth-yes" role="radio" aria-checked="false" /><label for="auth-yes">Yes</label></div>
        <div class="as-answer-item"><input type="radio" id="auth-no" role="radio" aria-checked="false" /><label for="auth-no">No</label></div>
      </div>
    </c-as-apply-question>

    <c-as-apply-question id="experience-years">
      <h1 class="as-question-title">How many years of work experience do you have?<span>*</span></h1>
      <div class="as-answers-container">
        <div class="as-answer-item"><input type="radio" id="years-none" role="radio" /><label for="years-none">None</label></div>
        <div class="as-answer-item"><input type="radio" id="years-1" role="radio" /><label for="years-1">1-3 years</label></div>
        <div class="as-answer-item"><input type="radio" id="years-4" role="radio" /><label for="years-4">4-5 years</label></div>
        <div class="as-answer-item"><input type="radio" id="years-6" role="radio" /><label for="years-6">6-10 years</label></div>
        <div class="as-answer-item"><input type="radio" id="years-10" role="radio" /><label for="years-10">10+ years</label></div>
      </div>
    </c-as-apply-question>

    <c-as-apply-question id="work-setting">
      <h1 class="as-question-title">What work settings are you open to?<span>*</span></h1>
      <div class="as-answers-container">
        <div class="as-answer-item"><input type="checkbox" name="options" id="hybrid" alt="Hybrid" /><label for="hybrid">Hybrid</label></div>
        <div class="as-answer-item"><input type="checkbox" name="options" id="onsite" alt="On-site" /><label for="onsite">On-site</label></div>
        <div class="as-answer-item"><input type="checkbox" name="options" id="remote" alt="Remote" /><label for="remote">Remote</label></div>
      </div>
    </c-as-apply-question>

    <c-as-apply-question id="communication">
      <h1 class="as-question-title">How would you like to be contacted regarding next steps?<span>*</span></h1>
      <div class="as-answers-container">
        <input type="radio" id="sms-yes" /><label for="sms-yes">I agree to receive text messages.</label>
        <input type="radio" id="sms-no" /><label for="sms-no">I do not want to receive text messages.</label>
      </div>
    </c-as-apply-question>

    <script>
      for (const wrapper of document.querySelectorAll('c-lwc-drop-down-menu')) {
        const button = wrapper.querySelector('button')
        button.addEventListener('click', () => {
          button.setAttribute('aria-expanded', 'true')
          const country = wrapper.dataset.kind === 'country'
          const menu = document.createElement('div')
          menu.setAttribute('role', 'menu')
          menu.innerHTML = country
            ? '<div role="menuitem">United States</div><div role="menuitem">Canada</div>'
            : '<div role="menuitem">California</div><div role="menuitem">New York</div>'
          menu.addEventListener('click', (event) => {
            const item = event.target.closest('[role="menuitem"]')
            if (!item) return
            button.childNodes[0].textContent = item.textContent
            button.dataset.selected = item.textContent
            button.setAttribute('aria-expanded', 'false')
            menu.remove()
          })
          wrapper.append(menu)
        })
      }
    </script>
    <script type="module">
      if (new URL(location.href).searchParams.has('carbon-test')) {
        const { detectFields } = await import('../src/content/detect.ts')
        const { fillFields } = await import('../src/content/fill.ts')
        const { heuristicValue, suggestionHints } = await import('../src/lib/match.ts')
        const store = {
          version: 1,
          identity: {
            firstName: 'Taylor', middleName: '', lastName: 'Morgan', nameSuffix: '', preferredName: '',
            email: 'taylor@example.com', phone: '+1 (555) 555-0100', phoneAlt: '', address1: '123 Main St.', address2: '',
            city: 'Los Angeles', state: 'California', postalCode: '90210', country: 'United States', linkedin: '',
            github: '', portfolio: '', website: '', headline: '', summary: '', workAuthorized: 'yes',
            needsSponsorship: 'no', willingToRelocate: '', noticePeriod: '', salaryExpectation: '', pronouns: '',
            desiredJobTitle: '', yearsExperience: '8', citizenship: '', visaStatus: '', employmentType: '',
            remotePreference: 'Remote', willingToTravel: '', gender: '', ethnicity: '', veteranStatus: '', disabilityStatus: '',
          },
          experience: [], education: [], skills: [], answers: [],
          resume: { name: 'resume.txt', mime: 'text/plain', dataBase64: 'VGVzdCByZXN1bWU=', text: 'Test resume', uploadedAt: '' },
          settings: { enabled: true, openrouterKey: '', openrouterModel: '', fillUnmatchedWithAI: true },
        }
        const detected = detectFields()
        const items = detected.fields.map((field) => ({
          uid: field.uid,
          value: heuristicValue(field, store),
          source: 'heuristic',
          suggestionHints: suggestionHints(field, store),
        })).filter((item) => item.value)
        const result = await fillFields(items, store.resume)
        document.body.dataset.carbonDetected = JSON.stringify(detected.fields.map(({ label, matchKey, options }) => ({ label, matchKey, options })))
        document.body.dataset.carbonFillResult = JSON.stringify(result)
        document.body.dataset.carbonSelections = JSON.stringify({
          country: document.querySelector('[data-kind="country"] button').dataset.selected,
          state: document.querySelector('[data-kind="state"] button').dataset.selected,
          phone: document.querySelector('[aria-labelledby="phone-label"]').value,
          authorized: document.querySelector('#auth-yes').checked,
          years: document.querySelector('#years-6').checked,
          remote: document.querySelector('#remote').checked,
          hybrid: document.querySelector('#hybrid').checked,
          communicationDetected: detected.fields.some((field) => /contacted|text messages/i.test(field.label)),
          resume: document.querySelector('#resume').files?.[0]?.name,
        })
      }
    </script>
  </body>
</html>
